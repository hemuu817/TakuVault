version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

    # minor/patch をまとめて1本にする（レビュー負荷を下げる）
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # 重要：メジャー更新PRは作らせない（Rails 8 などの事故防止）
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
